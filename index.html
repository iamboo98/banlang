<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bản Làng</title>
<meta name="theme-color" content="#1b2445">
<meta name="description" content="Bản Làng: dựng bản làng vùng cao qua 9 thời kỳ lịch sử Việt Nam, từ thời nguyên thuỷ tới thời kỳ đổi mới. Chơi offline, đăng nhập Google để lưu tiến trình.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bản Làng">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script>window.__BANLANG_APP = true;</script>
<script src="firebase-config.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cham:#1b2445; --cham2:#131a33; --cham3:#26315c;
  --do:#b8322a; --do2:#8f241e; --nghe:#e9b434; --lanh:#f6efdf; --lanh2:#eadfc4; --lanh3:#fffaf0;
  --ink:#1d2648; --muted:#6c6a78; --ok:#3d8a3a; --bad:#b8322a;
  --brocade:none;
  --disp:'Baloo 2', 'Be Vietnam Pro', system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cham2);color:var(--lanh);font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
svg{display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#app.pre #hud,#app.pre .band,#app.pre #tabs,#app.pre .zoom{display:none}

/* HUD */
#hud{background:linear-gradient(180deg,#1f2a50,#18213f);padding:8px 10px 8px;flex:0 0 auto;position:relative;z-index:3}
.hud-top{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.vtitle{flex:1;min-width:0;display:flex;align-items:baseline;gap:7px}
.vname{font-family:var(--disp);font-weight:800;font-size:20px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff8e6}
.rank{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--cham);background:var(--nghe);padding:2px 7px 1px;border-radius:20px;white-space:nowrap}
.season{position:relative;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;background:rgba(255,255,255,.08);border-radius:20px;padding:4px 10px 5px 6px;white-space:nowrap;overflow:hidden}
.season .sico{width:18px;height:18px}
.season i{position:absolute;left:0;bottom:0;height:2px;background:var(--nghe);opacity:.8;width:0}
.season .yr{display:none}
.cloud{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.08);display:grid;place-items:center;padding:0;flex:0 0 auto}
.cloud span{width:22px;height:22px}
.vol{display:block;padding:6px 0}
.vol span{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.vol input{width:100%;accent-color:var(--do)}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:4px 6px;min-width:0}
.chip .ic{width:20px;height:20px;flex:0 0 auto}
.chip .tx{min-width:0;line-height:1.05}
.chip b{font-family:var(--disp);font-weight:700;font-size:15px;display:block;white-space:nowrap}
.chip b small{font-size:10px;font-weight:600;opacity:.55;margin-left:1px}
.chip em{font-style:normal;font-size:10px;opacity:.72;white-space:nowrap;display:block}
.chip em.up{color:#9be08a;opacity:1}.chip em.down{color:#ff8f80;opacity:1}
.chip.full b{color:var(--nghe)}
.mats{display:flex;gap:4px;margin-top:5px}
.mat{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:2px 4px;cursor:pointer}
.mat svg{width:15px;height:15px;flex:0 0 auto}
.mat b{font-family:var(--disp);font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff8e6}
.mat i{font-style:normal;font-size:9px;opacity:.7;white-space:nowrap}
.band{height:7px;background:var(--brocade);background-size:auto 7px;flex:0 0 auto}

/* Stage */
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#9fc8e2}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
[hidden]{display:none !important}
.zoom{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:36px;height:36px;border-radius:12px;border:0;background:rgba(19,26,51,.72);color:#fff;font-size:20px;font-weight:700;display:grid;place-items:center;padding:0;backdrop-filter:blur(4px)}
#questPill{position:absolute;left:8px;bottom:10px;z-index:2;max-width:calc(100% - 64px);display:flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:7px 12px 7px 8px;background:rgba(246,239,223,.95);color:var(--ink);text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#questPill .qi{width:26px;height:26px;flex:0 0 auto;border-radius:8px;background:var(--cham);display:grid;place-items:center}
#questPill .qi svg{width:17px;height:17px}
#questPill .qt{min-width:0}
#questPill .qt b{display:block;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#questPill .qt span{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#questPill .bar{height:4px;border-radius:3px;background:#e2d6ba;margin-top:3px;overflow:hidden}
#questPill .bar i{display:block;height:100%;background:var(--ok);width:0}
#questPill.ready{background:var(--nghe);animation:pulse 1.4s ease-in-out infinite}
#questPill.ready .qt span{color:var(--cham);font-weight:700}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
#buildBar{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:10px;background:var(--cham);color:#fff;border-radius:14px;padding:6px 6px 6px 12px;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:calc(100% - 20px)}
#bbThumb{width:42px;height:35px;flex:0 0 auto;margin:-4px -2px -4px -6px}
#buildBar span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#buildBar b{color:var(--nghe)}
#buildBar button{border:0;background:var(--nghe);color:var(--cham);font-weight:700;border-radius:10px;padding:6px 12px;font-size:13px;flex:0 0 auto}
#buildBar button.ghostb{background:rgba(255,255,255,.14);color:#fff;display:inline-flex;align-items:center;gap:4px;padding:6px 10px}
#buildBar button.ghostb svg,.btn svg.rot{width:16px;height:16px}
#toasts{position:absolute;left:50%;top:56px;transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:calc(100% - 24px)}
.toast{background:rgba(19,26,51,.92);color:#fff;font-size:13px;padding:8px 14px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:100%;text-align:center;animation:tin .25s ease-out}
.toast.good{background:rgba(48,104,50,.95)}.toast.bad{background:rgba(143,36,30,.95)}.toast.gold{background:var(--nghe);color:var(--cham);font-weight:600}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* Sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;max-height:60%;display:flex;flex-direction:column;background:var(--lanh);color:var(--ink);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.28);overflow:hidden;animation:sup .22s ease-out}
@keyframes sup{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-band{height:6px;background:var(--brocade);background-size:auto 6px;flex:0 0 auto}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 12px 4px 16px;flex:0 0 auto}
.sheet-head h2{font-family:var(--disp);font-weight:800;font-size:21px;margin:0;flex:1;line-height:1.1}
.x{width:34px;height:34px;border-radius:50%;border:0;background:var(--lanh2);font-size:22px;line-height:1;padding:0;color:var(--ink)}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 14px 18px;flex:1 1 auto;-webkit-user-select:text;user-select:text}
.hint{font-size:13px;color:var(--muted);margin:2px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.card{background:var(--lanh3);border:1px solid #e3d6b8;border-radius:14px;padding:8px;text-align:left;color:var(--ink)}
.bcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:6px 6px 8px}
.bcard canvas{width:72px;height:58px}
.bcard .bname{font-weight:700;font-size:12.5px;line-height:1.2}
.bcard.locked{opacity:.55}
.bcard:disabled{cursor:default}
.lock{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px;justify-content:center}
.lock svg{width:12px;height:12px}
.costs{display:flex;flex-wrap:wrap;gap:3px 7px;justify-content:center}
.cc{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;font-family:var(--disp)}
.cc svg{width:15px;height:15px}
.cc.no{color:var(--bad)}
.wk{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:2px}
.wk svg{width:13px;height:13px}
.row{display:flex;align-items:center;gap:10px}
.opt{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:7px}
.opt canvas{width:56px;height:46px;flex:0 0 auto}
.opt .oinfo{flex:1;min-width:0}
.opt .oinfo b{display:block;font-size:14px}
.opt .costs{justify-content:flex-start}
.bhead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.bhead canvas{width:84px;height:70px;flex:0 0 auto}
.bhead p{margin:0;font-size:13.5px;line-height:1.45}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #dccfae;font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv b{font-family:var(--disp);font-size:16px}
.notes{margin:6px 0 2px;padding:0;list-style:none;font-size:12.5px;color:var(--muted)}
.notes li{padding:2px 0}
.notes li::before{content:"◆ ";color:var(--do);font-size:9px;vertical-align:1px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:#dff0d6;color:#2d6a2b}
.tag.off{background:#f6d8d3;color:var(--do2)}
.tag.gold{background:#f7e3a8;color:#7a5600}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn.primary{background:var(--do);color:#fff}
.btn.dark{background:var(--cham);color:#fff}
.btn.gold{background:var(--nghe);color:var(--cham)}
.btn.ghost{background:transparent;border:1.5px solid #cdbf9c;color:var(--ink)}
.btn.danger{color:var(--do);border-color:#e3b0a8}
.btn.small{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.42;cursor:default}
.btn .costs{gap:2px 6px}
.btn.primary .cc.no,.btn.dark .cc.no{color:#ffd0c8}
.mkmul{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:2px 0 6px}
.mkmul span{font-size:12.5px;color:var(--muted);margin-right:2px}
.mkmul button{border:1.5px solid #cdbf9c;background:transparent;border-radius:9px;padding:4px 9px;font-size:12.5px;font-weight:700;color:var(--ink)}
.mkmul button.on{background:var(--cham);border-color:var(--cham);color:#fff}
.mres span + span{display:block}
.mrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed #dccfae}
.mrow:last-child{border-bottom:0}
.mres{display:flex;align-items:center;gap:7px;min-width:0}
.mres svg{width:24px;height:24px;flex:0 0 auto}
.mres b{display:block;font-size:14px}
.mres span{font-size:11.5px;color:var(--muted)}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:1px;border:0;border-radius:11px;padding:6px 9px;min-width:74px;font-size:12px;font-weight:700}
.mbtn.sell{background:var(--cham);color:#fff}
.mbtn.buy{background:var(--lanh2);color:var(--ink)}
.mbtn small{font-weight:600;opacity:.8;font-size:11px;display:flex;align-items:center;gap:2px}
.mbtn small svg{width:13px;height:13px}
.mbtn:disabled{opacity:.4}
.banner{border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px;background:var(--cham);color:#fff;display:flex;gap:8px;align-items:center}
.banner.gold{background:var(--nghe);color:var(--cham);font-weight:600}
.banner.soft{background:#efe4c8;color:var(--ink)}
.qcard{margin-bottom:10px}
.qcard h3{margin:0 0 4px;font-family:var(--disp);font-size:18px}
.qcard p{margin:0 0 8px;font-size:13.5px;line-height:1.45}
.pbar{height:8px;border-radius:5px;background:#e2d6ba;overflow:hidden;margin:6px 0}
.pbar i{display:block;height:100%;background:var(--ok)}
.qlist{list-style:none;margin:0;padding:0}
.qlist li{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 2px;border-bottom:1px dashed #e0d3b3}
.qlist li.done{color:var(--muted)}
.qlist li .ck{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:0 0 auto;background:#e6dcc2;color:#8a7f66}
.qlist li.done .ck{background:var(--ok);color:#fff}
.acct{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.acct img{width:44px;height:44px;border-radius:50%;background:#ddd;flex:0 0 auto;object-fit:cover}
.acct b{display:block;font-size:15px}
.acct span{font-size:12.5px;color:var(--muted);line-height:1.4;display:block}
.field{display:flex;gap:8px;margin-top:6px}
.field input{flex:1;min-width:0;border:1.5px solid #d4c6a4;border-radius:11px;padding:9px 11px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.sec{font-family:var(--disp);font-weight:700;font-size:15px;margin:16px 0 4px;color:var(--do2);letter-spacing:.02em}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:10px;border:0;background:var(--cham);color:#fff;font-size:20px;font-weight:700;padding:0;line-height:1}
.stepper button:disabled{opacity:.3}
.stepper b{font-family:var(--disp);font-size:20px;min-width:44px;text-align:center}
.stepper b small{font-size:13px;color:var(--muted)}
.crew{display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:2px 0 8px;font-size:12.5px;color:var(--muted)}
.crew i{width:14px;height:14px;border-radius:50%;background:#e2d6ba;display:inline-block}
.crew i.on{background:var(--ok)}
.crew i.miss{background:#f0b5ab}
.crew span{margin-left:6px}
.autobox{margin-bottom:10px;padding:4px 12px}
.arow{display:flex;align-items:center;gap:10px;padding:8px 0}
.arow + .arow{border-top:1px dashed #dccfae}
.arow > div{flex:1;min-width:0}
.arow b{display:block;font-size:14px}
.arow span{display:block;font-size:12px;color:var(--muted);line-height:1.4;margin-top:1px}
.tgl{width:50px;height:30px;border-radius:15px;border:0;background:#cfc3a5;position:relative;padding:0;flex:0 0 auto;transition:background .2s}
.tgl i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.tgl.on{background:var(--ok)}
.tgl.on i{left:23px}
.modcard{margin-bottom:8px}
.bera{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bera small{font-family:inherit;font-size:11.5px;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
.bfut{margin-top:10px}
.bfut summary{cursor:pointer;font-weight:700;color:#8a6a2a;padding:8px 0}
.bfut .grid{opacity:.8}
.icn{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-right:3px}.icn svg{width:100%;height:100%;display:block}
.soc .pyr{display:flex;flex-direction:column;align-items:center;gap:3px}
.ptier{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 9px;border-radius:7px;font-size:12.5px;background:rgba(184,50,42,calc(var(--f)*.85));color:#fff;min-width:0}
.ptier span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ptier b{font-family:var(--disp);font-size:13px;flex:0 0 auto}
.ptier.miss{background:repeating-linear-gradient(45deg,#e6dcc2,#e6dcc2 6px,#efe6cf 6px,#efe6cf 12px);color:#8a7f66}
.socd{margin-top:8px;font-size:12.5px;line-height:1.45}
.socd summary{cursor:pointer;color:#8a6a2a;font-weight:600}
.socd p{margin:5px 0}
.gbtn{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#1f1f1f;border:1px solid #dadce0}
.st-card .gbtn{width:100%;margin:2px 0 10px}
.glist{list-style:none;margin:0 0 6px;padding:0}
.glist li{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px dashed #e0d3b3}
.glist li .ck{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:0 0 auto;background:#e6dcc2;color:#8a7f66}
.glist li.done .ck{background:var(--ok);color:#fff}
.glist li.done .gtx b{color:var(--muted);font-weight:500}
.glist .gtx{flex:1;min-width:0}
.glist .gtx b{display:block;font-size:13.5px;line-height:1.35}
.glist .gtx small{font-size:11.5px;color:var(--muted)}
.glist .pbar{height:5px;margin:4px 0 2px}
.hist h3{margin:6px 0 2px;font-family:var(--disp);font-size:20px;line-height:1.2}
.hist p{margin:0 0 6px;font-size:13px;line-height:1.5}
.ev{font-size:13px;line-height:1.5;background:#f6eedb;border-left:3px solid var(--nghe);padding:7px 10px;border-radius:6px;margin:0 0 8px}
.tl li{align-items:flex-start}
.tl li.cur{background:#fbf3df;border-radius:8px}
.tl small{color:var(--muted);font-size:11.5px;line-height:1.4}
.tl details{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.tl summary{cursor:pointer;color:#8a6a2a}
.modcard.done{opacity:.72}
.modcard .mhead{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.modcard .mhead b{font-size:14.5px;display:block;margin-bottom:2px}
.modcard .mic{width:38px;height:38px;border-radius:11px;background:var(--cham);color:var(--nghe);display:grid;place-items:center;flex:0 0 auto}
.modcard .mic svg{width:22px;height:22px}
.modcard.done .mic{background:var(--ok);color:#fff}
.modcard p{font-size:12.8px;line-height:1.45;margin:4px 0 8px}
#netBar{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--cham);color:#fff;border-radius:14px;padding:6px 8px 6px 12px;font-size:11.5px;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:calc(100% - 20px)}
#netBar span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
#netBar i{width:10px;height:10px;border-radius:3px;display:inline-block}
#netBar button{border:0;background:var(--nghe);color:var(--cham);font-weight:700;border-radius:9px;padding:4px 10px;font-size:12px}

/* pick tile considering tall sprites */
function pickTile(sx, sy){
  const [wx, wy] = s2w(sx, sy);
  const g = w2tile(wx, wy);
  let best = g ? {i:g.i, j:g.j, d:g.i + g.j - 0.01} : null;
  if (!G.S) return best;
  const cov = coverOf(G.S);
  if (g){ const cv = cov[idx(g.i, g.j)]; if (cv >= 0){ const ci = cv % N, cj = (cv/N)|0; best = {i:ci, j:cj, d:ci + cj + bSizeAt(cv) - 1 + 0.01}; } }
  for (let k = 0; k < N*N; k++){
    const t = G.S.tiles[k]; if (!t.b && t.t !== 'f' && t.t !== 'r' && !t.rg) continue;
    if (!t.b && cov[k] >= 0) continue;
    const z = t.b ? bSizeAt(k) : 1, i = k % N, j = (k/N)|0, cx = (i-j)*HW, cy = (i+j)*HH + (z - 1)*HH;
    const h = t.b ? bH(t.b.k, t.b.l) : t.t === 'f' ? 34 : t.t === 'r' ? 26 : 20;
    if (wx > cx - HW*0.55*z && wx < cx + HW*0.55*z && wy > cy - h && wy < cy + HH*0.6*z){ const d = i + j + z - 1; if (!best || d > best.d) best = {i, j, d}; }
  }
  return best;
}

function hipRoof(c, p, u0, v0, A, Bv, z, h, rf, cols){

function updateParticles(dt){
  const s = dt/1000;
  for (const p of parts){ p.life += dt; p.x += p.vx*s; p.y += p.vy*s; if (p.type === 'smoke'){ p.r += s*2.4; p.vx += s*1.5; } else if (p.type === 'drop' || p.type === 'conf' || p.type === 'dust'){ p.vy += (p.type === 'drop' ? 80 : p.type === 'conf' ? 30 : 10)*s; if (p.type === 'conf'){ p.rot += s*6; p.vx *= 0.99; } } }
  parts = parts.filter(p => p.life < p.max);
  for (const f of floats) f.life += dt;
  floats = floats.filter(f => f.life < f.max);
  const S = G.S; if (!S) return;
  const season = SEASONS[seasonIdx(S.day)].k, rain = S.mods.some(m => m.rain), frost = S.mods.some(m => m.frost);
  const rate = rain ? 0.5 : season === 'xuan' ? 0.005 : season === 'thu' ? 0.004 : season === 'dong' ? (frost ? 0.04 : 0.006) : 0;
  let n = rate*dt; while (n > 0 && screenParts.length < 220){ if (Math.random() < n){
    if (rain) screenParts.push({type:'rain', x:Math.random()*(W + 40), y:-10, vx:-60, vy:520, life:0, max:2000});
    else if (season === 'dong') screenParts.push({type:'snow', x:Math.random()*W, y:-5, vx:(Math.random()-0.5)*10, vy:18 + Math.random()*16, life:0, max:12000, r:0.8 + Math.random()*1.3});
    else screenParts.push({type:'petal', x:Math.random()*W*1.2, y:-5, vx:-12 - Math.random()*14, vy:20 + Math.random()*14, life:0, max:14000, rot:Math.random()*6, vr:(Math.random()-0.5)*3, col:season === 'xuan' ? pick(['#ffffff','#fde6ee','#f6b8c9']) : pick(['#d9962f','#c4702a','#e8b84a'])});
  } n -= 1; }
  for (const p of screenParts){ p.life += dt; p.x += p.vx*s + (p.type === 'petal' ? Math.sin(p.life/500)*0.4 : 0); p.y += p.vy*s; if (p.rot !== undefined) p.rot += (p.vr || 0)*s; }
  screenParts = screenParts.filter(p => p.life < p.max && p.y < Hh + 10 && p.x > -20);
  if (S.fest && G.E && G.E.rongK != null && Math.random() < dt/900){ const [x,y] = tileCenter(G.E.rongK); spawnConfetti(x, y, 8); }
}

  const S = G.S, gains = {};
  for (const k of RES_KEYS){ const d = Math.floor(S.res[k] - r.before.res[k]); if (d) gains[k] = d; }
  let h = '<div class="gain">' + Object.entries(gains).map(([k, v]) => '<span class="cc" style="color:' + (v < 0 ? 'var(--bad)' : 'var(--ink)') + '">' + ICON[k] + (v > 0 ? '+' : '') + fmt(v) + '</span>').join('') + (S.pop !== r.before.pop ? '<span class="cc">' + ICON.dan + (S.pop > r.before.pop ? '+' : '') + (S.pop - r.before.pop) + '</span>' : '') + '</div>';
  const st = S.stats, b0 = r.before.st || {}, ev = [];
  const dw = (st.weddings || 0) - (b0.weddings || 0), db = (st.births || 0) - (b0.births || 0), dp = (st.passed || 0) - (b0.passed || 0);
  if (dw) ev.push(dw + ' đám cưới'); if (db) ev.push(db + ' em bé chào đời'); if (dp) ev.push(dp + ' cụ già về với tổ tiên');
  if (ev.length) h += '<p style="font-size:13px;color:var(--muted)">' + ev.join(' · ') + '.</p>';
  return h;
}
function enterGame(S, fresh){
  $('#app').classList.remove('pre'); setN(S.size || BASE_N); resize();
  G.demo = false; G.S = S; G.playing = true; G.sel = null; endBuild(); closeSheet();
  people = []; parts = []; floats = []; vehicles = [];
  const away = Date.now() - (S.saved || Date.now());

  $('#start').hidden = true;
  cam.x = 0; cam.y = (N-1)*HH + 6; cam.z = clamp(fitZ*(W < 600 ? 1.25 : 0.98), zMin(), zMax()); G.camT = null;
  setStatus(Cloud.ref && Cloud.readOK ? 'ok' : Cloud.ref ? 'offline' : 'local', Cloud.ref ? '' : (Cloud.uid ? '' : ''));
  if (r && r.days > 0){

    showModal('Bản làng lúc bạn vắng nhà', '<p>Bạn đi vắng ' + (hrs ? hrs + ' giờ ' : '') + mins + ' phút. Bản đã trải qua <b>' + r.days + ' ngày</b>' + (r.capped ? ' (tối đa ' + OFFLINE_CAP_DAYS + ' ngày)' : '') + ':</p>' + summaryHTML(r), [{label:'Vào bản', cls:'gold'}]);
  }
  Sound.unlock(); setTimeout(() => Sound.sfx('gong'), 120);
  if (G.notice){ const msg = G.notice; G.notice = null; setTimeout(() => toast(msg, 'gold'), 900); fresh = true; }
  if (fresh || (r && r.days > 0)){ G.dirty = true; save(); } else G.dirty = false;
}
function newGame(name){
  G.notice = null;
  const S = newState(name, (Math.random()*1e9)|0);
  enterGame(S, true);
  showModal('Chào mừng tới ' + S.name + '!', '<p>Ba người dân vừa dựng túp lều đầu tiên bên suối, giữa thời nguyên thuỷ. Hãy giúp họ dựng bản:</p><p>◆ <b>Chạm vào ô đất</b> để xây, chạm vào <b>rừng</b> để chặt cây.<br>◆ <b>Ruộng sát suối</b> cho nhiều lúa hơn.<br>◆ Làm theo <b>Nhiệm vụ</b> ở góc dưới để nhận thưởng.<br>◆ Bản đi qua <b>9 thời kỳ lịch sử Việt Nam</b>, từ thời nguyên thuỷ tới thời kỳ đổi mới. Bấm nút <b>Màn</b> ở góc trên để xem mục tiêu từng thời kỳ.<br>◆ Kéo để di chuyển, chụm hai ngón để phóng to.</p>', [{label:'Bắt đầu', cls:'gold'}]);
}
function demoState(){
  const S = newState('Bản Mây', 4242);
  const want = ['ruong','ruong','ruong','nha_san','nha_san','vuon','kho','tieu_phu','nha_rong','trong_dong','chuong_trau','coi_nuoc','cho_phien','khung_det','muong','nha_san','lo_duc'];
  S.era = 2;
  S.best = 50; S.pop = 14; syncPop(S); for (let k = 0; k < 4; k++) S.people.push(mkPerson(S, Math.random() < 0.5 ? 'm' : 'f', 3 + Math.floor(Math.random()*10))); S.people.push(mkPerson(S, 'f', 66)); S.pop = S.people.length;
  for (const k of want){ for (let tries = 0; tries < 200; tries++){ const ix = Math.floor(mulberry32(tries*31 + k.length*7 + S.nextId)()*N*N); const i = ix % N, j = (ix/N)|0; if (Math.hypot(i - 6, j - 6) > 4.5) continue; if (!placeCheck(S, k, i, j)){ S.tiles[ix].b = {k, l:1 + (k === 'nha_san' ? S.nextId % 3 : 0), id:S.nextId++}; break; } } }
  return S;
}
function renderStart(info){
  const card = $('#stCard');
  const me = Cloud.me;
  let acct;
  if (Cloud.uid){
    acct = '<div class="st-acct">' + (me && me.avatarUrl ? '<img alt="" referrerpolicy="no-referrer" src="' + esc(me.avatarUrl) + '">' : '') + '<div><b>' + esc((me && me.name) || 'Đã đăng nhập') + '</b><span>' + (info.cloudOk ? 'Tiến trình được lưu vào tài khoản của bạn.' : 'Chưa đọc được dữ liệu trên tài khoản, tạm lưu trên máy này.') + '</span></div></div>';

  if (info.replacing){ const bk = document.createElement('button'); bk.className = 'link'; bk.textContent = 'Quay lại bản cũ'; bk.onclick = () => renderStart(Object.assign({}, info, {save:info.prev, replacing:false})); card.appendChild(bk); }
  const st = $('#btnStart'); if (st) st.onclick = () => { const v = ($('#stName').value || '').trim().slice(0, 24) || 'Bản Mây'; newGame(v); };
}

/* ================= MAIN LOOP ================= */
let last = performance.now(), hudT = 0, coiPh = null;
function frame(now){
  let dt = now - last; last = now;
  frameDt = Math.min(dt, 100);
  const S = G.S;
  if (S && G.playing){
    if (dt > 5000){
      const r = catchUp(dt); G.E = computeEconomy(S); syncPeople(); renderHUD(); checkQuest();
      if (r.days > 0) toast('Đã trôi qua ' + r.days + ' ngày khi bạn rời mắt.', '');
      G.dirty = true;
    } else {
      S.dayT += dt; S.playMs += dt;
      let ticked = false;
      while (S.dayT >= DAY_MS){ S.dayT -= DAY_MS; G.E = dayTick(S, true); ticked = true; }
      if (ticked){ changed(false); }
    }
  } else if (S && G.demo){ S.dayT += dt; if (S.dayT > DAY_MS){ S.dayT = 0; } }
  if (G.camT){ const k = Math.min(1, frameDt/140); cam.x += (G.camT.x - cam.x)*k; cam.y += (G.camT.y - cam.y)*k; cam.z += (G.camT.z - cam.z)*k; if (Math.abs(G.camT.x - cam.x) + Math.abs(G.camT.y - cam.y) < 0.5 && Math.abs(G.camT.z - cam.z) < 0.003) G.camT = null; clampCam(); }
  updatePeople(frameDt); updateVehicles(frameDt); updateParticles(frameDt);
  render(now);
  if (G.S && (G.playing || G.demo)){
    const ck = G.S.tiles.findIndex(t => t.b && t.b.k === 'coi_nuoc');
    if (ck >= 0){ const ci = ck % N, cj = (ck/N)|0, ph = (now/2800 + hash2(ci, cj, 99)) % 1; if (coiPh != null && ph < coiPh - 0.5){ const [sx, sy] = w2s((ci-cj)*HW, (ci+cj)*HH); if (sx > -40 && sx < W + 40 && sy > -40 && sy < Hh + 40) Sound.thump(clamp(cam.z/0.9, 0.35, 1.1)); } coiPh = ph; } else coiPh = null;
  }
  if (G.S && G.playing && G.E && Math.random() < frameDt/1300){
    const mines = []; for (const k in G.E.info){ const inf = G.E.info[k], tl = G.S.tiles[+k]; if (inf.got && tl.b && (tl.b.k === 'mo_bac' || tl.b.k === 'mo_da')) mines.push(+k); }
    if (mines.length){ const k = pick(mines), [sx, sy] = w2s(...tileCenter(k)); if (sx > -40 && sx < W + 40 && sy > -40 && sy < Hh + 40) Sound.clink(clamp(cam.z/0.9, 0.3, 1.1)); }
  }
  hudT += dt; if (hudT > 200){ hudT = 0; updateDayBar(); }
  requestAnimationFrame(frame);
}

renderTabs(); renderCloudIcon(); renderSoundIcon();
resize();
G.S = demoState(); G.E = computeEconomy(G.S); G.demo = true; syncPeople();
cam.z = clamp(fitZ*(W < 600 ? 1.05 : 0.9), zMin(), zMax()); cam.y = (N-1)*HH + Hh*0.16/cam.z;
requestAnimationFrame(frame);
(async () => {
  await initCloud();
  let cloudOk = false, save0 = null;
  if (Cloud.ref){

  }

  else best = save0 || loc || guest;
  Cloud.status = Cloud.ref ? (cloudOk ? 'ok' : 'offline') : 'local';

  renderStart({save:best, cloudOk, alt, push:!!(Cloud.ref && cloudOk && best && best !== save0)});
})();
